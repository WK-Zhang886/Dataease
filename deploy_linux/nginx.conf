# DataEase 2.10 standalone Nginx 配置
# 前端静态文件 + 后端 API 反代 (/de2api -> 18000)
# 使用独立端口 8088/18000，与服务器上现有平台共存
# 由 deploy.sh 安装到 /etc/nginx/conf.d/dataease.conf
# 也可手动放置并调整路径

server {
    listen 8088;
    server_name _;

    # 上传大小限制（Excel 导入）
    client_max_body_size 500m;

    # 前端构建产物目录 (dist)
    root /opt/dataease2.0/webroot;
    index index.html;

    # 前端 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：剥离 /de2api 前缀后反代到后端 18000
    location /de2api/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
